server {
    listen 80;

    # 1. ENTREGA ERRO 404 NA RAIZ (/) SEM REDIRECIONAR
    location = / {
        default_type text/html;
        return 200 '<meta name="color-scheme" content="dark"><title>404</title>404';
    }

    # 2. SE O NAVEGADOR AINDA TENTAR "/error.html" OU "/error.html/", REDIRECIONA DE VOLTA PARA A RAIZ LIMPA
    location ~ ^/error\.html/?$ {
        return 301 /;
    }

    # 3. TODAS AS OUTRAS ROTAS E APIS PASSAM NORMALMENTE PARA O TRAEFIK
    location / {
        proxy_pass http://runtipi-reverse-proxy:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
