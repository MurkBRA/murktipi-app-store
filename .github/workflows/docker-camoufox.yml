name: Build & Publish Camoufox Playwright Server

on:
  push:
    branches: [ main, master ]
    paths:
      - 'packages/camoufox/**'
      - 'apps/camoufox/config.json'
      - 'apps/camoufox/docker-compose.yml'
      - '.github/workflows/docker-camoufox.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: murkbra/camoufox

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve & verify app version
        id: appver
        run: |
          APP_VERSION=$(python3 -c "import json; print(json.load(open('apps/camoufox/config.json'))['version'])")
          REQ_VERSION=$(python3 -c "import re; print(re.search(r'camoufox\[geoip\]==([0-9.]+)', open('packages/camoufox/requirements.txt').read()).group(1))")
          if [ "$APP_VERSION" != "$REQ_VERSION" ]; then
            echo "Version mismatch: config.json=$APP_VERSION requirements.txt=$REQ_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing ghcr.io/${{ env.IMAGE_NAME }}:$APP_VERSION"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Camoufox package unit tests
        run: |
          pip install pytest
          pytest -v packages/camoufox/tests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.appver.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: packages/camoufox
          file: packages/camoufox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}"
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
