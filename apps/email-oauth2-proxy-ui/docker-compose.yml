x-runtipi:
  schema_version: 2

services:
  email-oauth2-proxy-ui:
    image: ghcr.io/murkbra/email-oauth2-proxy-ui:latest
    container_name: email-oauth2-proxy-ui
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8090"
    volumes:
      - ${ROOT_FOLDER_HOST}/app-data/${PROXY_STORE_ID:-migrated}/email-oauth2-proxy/data/config:/config:rw
      - ${ROOT_FOLDER_HOST}/user-config/${PROXY_STORE_ID:-migrated}/email-oauth2-proxy:/compose:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ}
      LISTEN_ADDR: ":8090"
      CONFIG_DIR: "/config"
      COMPOSE_DIR: "/compose"
      PROXY_HOST: "${PROXY_HOST:-email-oauth2-proxy}"
      PROXY_CONTAINER: "${PROXY_CONTAINER:-email-oauth2-proxy}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 8090

networks:
  tipi_main_network:
    external: true
