x-runtipi:
  schema_version: 2

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # api ID e HASH aqui é a do cliente não a do bot
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "${TELEGRAM_LOCAL:-1}"
      TELEGRAM_HTTP_PORT: "${TELEGRAM_HTTP_PORT:-2627}"
      TELEGRAM_STAT: "${TELEGRAM_STAT:-1}"
      TELEGRAM_VERBOSITY: "${TELEGRAM_VERBOSITY:-0}"
    ports:
      - "${APP_PORT}:2627"
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/telegram-bot-api
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 2627

networks:
  tipi_main_network:
    external: true
