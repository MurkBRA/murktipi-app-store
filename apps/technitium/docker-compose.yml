x-runtipi:
  schema_version: 2

services:
  technitium-dns:
    container_name: "technitium-dns"
    image: "technitium/dns-server:latest"
    restart: "unless-stopped"
    hostname: ${DNS_SERVER_DOMAIN:-technitium-dns}
    ports:
      - "${APP_PORT}:5380/tcp"
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      - "DNS_SERVER_DOMAIN=${DNS_SERVER_DOMAIN:-technitium-dns}"
      - "DNS_SERVER_RECURSION=${DNS_SERVER_RECURSION:-Allow}"
      - "DNS_SERVER_ADMIN_PASSWORD=${DNS_SERVER_ADMIN_PASSWORD:-senha}"
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/dns
      - ${APP_DATA_DIR}/data/logs:/var/log/technitium/dns
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://127.0.0.1:5380/api/dnsClient/healthCheck | grep '\"status\":\"ok\"' || exit 0"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5380

networks:
  tipi_main_network:
    external: true
