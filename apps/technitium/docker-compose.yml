x-runtipi:
  schema_version: 2

services:
  dns-server:
    image: technitium/dns-server:latest
    container_name: technitium-dns
    hostname: ${DNS_SERVER_DOMAIN:-dns-server}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Filter and unset all empty/blank DNS_SERVER_* environment variables
        # so they do not exist in the container environment or break Technitium defaults
        for var in $$(env | grep -E '^DNS_SERVER_' | cut -d= -f1); do
          eval "val=\$$$$var"
          if [ -z "$$val" ]; then
            unset "$$var"
          fi
        done
        exec /usr/bin/dotnet /opt/technitium/dns/DnsServerApp.dll /etc/dns
    ports:
      - "${APP_PORT}:5380/tcp"
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"
      - "853:853/udp"
    environment:
      # Core & Admin Settings
      DNS_SERVER_DOMAIN: ${DNS_SERVER_DOMAIN:-dns-server}
      DNS_SERVER_ADMIN_PASSWORD: ${DNS_SERVER_ADMIN_PASSWORD:-admin}
      DNS_SERVER_ADMIN_PASSWORD_FILE: ${DNS_SERVER_ADMIN_PASSWORD_FILE:-}
      DNS_SERVER_PREFER_IPV6: ${DNS_SERVER_PREFER_IPV6:-false}

      # Web Console Settings
      DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES: ${DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES:-}
      DNS_SERVER_WEB_SERVICE_HTTP_PORT: ${DNS_SERVER_WEB_SERVICE_HTTP_PORT:-5380}
      DNS_SERVER_WEB_SERVICE_HTTPS_PORT: ${DNS_SERVER_WEB_SERVICE_HTTPS_PORT:-53443}
      DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS: ${DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS:-false}
      DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT: ${DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT:-false}
      DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PATH: ${DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PATH:-}
      DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD: ${DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD:-}
      DNS_SERVER_WEB_SERVICE_HTTP_TO_TLS_REDIRECT: ${DNS_SERVER_WEB_SERVICE_HTTP_TO_TLS_REDIRECT:-false}
      DNS_SERVER_WEB_SERVICE_REVERSE_PROXY_ADDRESSES: ${DNS_SERVER_WEB_SERVICE_REVERSE_PROXY_ADDRESSES:-}
      DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP: ${DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP:-false}

      # DNS Resolution & Recursion
      DNS_SERVER_RECURSION: ${DNS_SERVER_RECURSION:-AllowOnlyForPrivateNetworks}
      DNS_SERVER_RECURSION_NETWORK_ACL: ${DNS_SERVER_RECURSION_NETWORK_ACL:-}
      DNS_SERVER_RECURSION_DENIED_NETWORKS: ${DNS_SERVER_RECURSION_DENIED_NETWORKS:-}
      DNS_SERVER_RECURSION_ALLOWED_NETWORKS: ${DNS_SERVER_RECURSION_ALLOWED_NETWORKS:-}

      # Ad-Blocking & Filtering
      DNS_SERVER_ENABLE_BLOCKING: ${DNS_SERVER_ENABLE_BLOCKING:-true}
      DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT: ${DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT:-false}
      DNS_SERVER_BLOCK_LIST_URLS: ${DNS_SERVER_BLOCK_LIST_URLS:-}

      # Upstream Forwarders
      DNS_SERVER_FORWARDERS: ${DNS_SERVER_FORWARDERS:-1.1.1.1, 8.8.8.8}
      DNS_SERVER_FORWARDER_PROTOCOL: ${DNS_SERVER_FORWARDER_PROTOCOL:-Tcp}

      # Logging & Stats
      DNS_SERVER_LOG_USING_LOCAL_TIME: ${DNS_SERVER_LOG_USING_LOCAL_TIME:-true}
      DNS_SERVER_LOG_FOLDER_PATH: ${DNS_SERVER_LOG_FOLDER_PATH:-/var/log/technitium/dns}
      DNS_SERVER_LOG_MAX_LOG_FILE_DAYS: ${DNS_SERVER_LOG_MAX_LOG_FILE_DAYS:-30}
      DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS: ${DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS:-false}
      DNS_SERVER_STATS_MAX_STAT_FILE_DAYS: ${DNS_SERVER_STATS_MAX_STAT_FILE_DAYS:-30}

      # SSO / OpenID Connect
      DNS_SERVER_SSO_ENABLED: ${DNS_SERVER_SSO_ENABLED:-false}
      DNS_SERVER_SSO_AUTHORITY: ${DNS_SERVER_SSO_AUTHORITY:-}
      DNS_SERVER_SSO_CLIENT_ID: ${DNS_SERVER_SSO_CLIENT_ID:-}
      DNS_SERVER_SSO_CLIENT_SECRET: ${DNS_SERVER_SSO_CLIENT_SECRET:-}
      DNS_SERVER_SSO_CLIENT_SECRET_FILE: ${DNS_SERVER_SSO_CLIENT_SECRET_FILE:-}
      DNS_SERVER_SSO_METADATA_ADDRESS: ${DNS_SERVER_SSO_METADATA_ADDRESS:-}
      DNS_SERVER_SSO_SCOPES: ${DNS_SERVER_SSO_SCOPES:-openid,profile,email}
      DNS_SERVER_SSO_ALLOW_SIGNUP: ${DNS_SERVER_SSO_ALLOW_SIGNUP:-false}
      DNS_SERVER_SSO_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS: ${DNS_SERVER_SSO_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS:-false}
      DNS_SERVER_SSO_GROUP_MAP: ${DNS_SERVER_SSO_GROUP_MAP:-}

      # LDAP / Active Directory
      DNS_SERVER_LDAP_ENABLED: ${DNS_SERVER_LDAP_ENABLED:-false}
      DNS_SERVER_LDAP_SERVER: ${DNS_SERVER_LDAP_SERVER:-}
      DNS_SERVER_LDAP_PORT: ${DNS_SERVER_LDAP_PORT:-389}
      DNS_SERVER_LDAP_SSL_OPTION: ${DNS_SERVER_LDAP_SSL_OPTION:-None}
      DNS_SERVER_LDAP_IGNORE_SSL_ERRORS: ${DNS_SERVER_LDAP_IGNORE_SSL_ERRORS:-false}
      DNS_SERVER_LDAP_BIND_USERNAME: ${DNS_SERVER_LDAP_BIND_USERNAME:-}
      DNS_SERVER_LDAP_BIND_PASSWORD: ${DNS_SERVER_LDAP_BIND_PASSWORD:-}
      DNS_SERVER_LDAP_BIND_PASSWORD_FILE: ${DNS_SERVER_LDAP_BIND_PASSWORD_FILE:-}
      DNS_SERVER_LDAP_SEARCH_BASE: ${DNS_SERVER_LDAP_SEARCH_BASE:-}
      DNS_SERVER_LDAP_USER_SEARCH_FILTER: ${DNS_SERVER_LDAP_USER_SEARCH_FILTER:-(sAMAccountName={0})}
      DNS_SERVER_LDAP_GROUP_ATTRIBUTE: ${DNS_SERVER_LDAP_GROUP_ATTRIBUTE:-memberOf}
      DNS_SERVER_LDAP_ALLOW_SIGNUP: ${DNS_SERVER_LDAP_ALLOW_SIGNUP:-false}
      DNS_SERVER_LDAP_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS: ${DNS_SERVER_LDAP_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS:-false}
      DNS_SERVER_LDAP_GROUP_MAP: ${DNS_SERVER_LDAP_GROUP_MAP:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/dns
      - ${APP_DATA_DIR}/data/logs:/var/log/technitium/dns
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://127.0.0.1:5380/api/dnsClient/healthCheck | grep '\"status\":\"ok\"' || exit 0"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 5380

networks:
  tipi_main_network:
    external: true
