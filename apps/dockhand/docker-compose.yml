x-runtipi:
  schema_version: 2

services:
  dockhand:
    image: fnsys/dockhand:v1.0.59
    container_name: "${CONTAINER_NAME:-dockhand}"
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/data/dockhand:/app/data
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000

networks:
  tipi_main_network:
    external: true
