x-runtipi:
  schema_version: 2

services:
  pic-smaller:
    image: ghcr.io/murkbra/pic-smaller:1.1.0
    container_name: "${CONTAINER_NAME:-pic-smaller}"
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 3000

networks:
  tipi_main_network:
    external: true
