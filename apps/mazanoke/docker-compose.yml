x-runtipi:
  schema_version: 2

services:
  mazanoke:
    image: ghcr.io/civilblur/mazanoke:v1.1.7
    container_name: "${CONTAINER_NAME:-mazanoke}"
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    environment:
      - USERNAME
      - PASSWORD
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/manifest.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 80

networks:
  tipi_main_network:
    external: true
