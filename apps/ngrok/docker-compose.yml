x-runtipi:
  schema_version: 2

services:
  ngrok-filtros:
    image: nginx:1.31.10-alpine
    container_name: "${FILTERS_CONTAINER_NAME:-ngrok-filtros}"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - ENABLE_NGINX_FILTER=${ENABLE_NGINX_FILTER:-true}
      - NGINX_CONF_B64=${NGINX_CONF_BASE64:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$$ENABLE_NGINX_FILTER" = "true" ]; then
          printf '%s' "$$NGINX_CONF_B64" | sed 's|^data:[^,]*,||' | tr -d ' \t\r\n' | base64 -d | tr -d '\r' > /etc/nginx/conf.d/default.conf
          exec nginx -g 'daemon off;'
        else
          echo "ngrok-filtros disabled (ENABLE_NGINX_FILTER=$$ENABLE_NGINX_FILTER)"
          trap 'exit 0' TERM INT
          while :; do sleep 86400 & wait $$!; done
        fi
    networks:
      - tipi_main_network

  ngrok:
    image: ngrok/ngrok:3.39.13-alpine
    container_name: "${CONTAINER_NAME:-ngrok}"
    restart: unless-stopped
    depends_on:
      - ngrok-filtros
    ports:
      - "${APP_PORT}:4040"
    environment:
      - TZ=${TZ}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_URL
      - ENABLE_NGINX_FILTER=${ENABLE_NGINX_FILTER:-true}
      - NGROK_TARGET
      - FILTERS_TARGET=${FILTERS_CONTAINER_NAME:-ngrok-filtros}:80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$$ENABLE_NGINX_FILTER" = "true" ]; then
          TARGET="$$FILTERS_TARGET"
        elif [ -n "$$NGROK_TARGET" ]; then
          TARGET="$$NGROK_TARGET"
        else
          TARGET="80"
        fi
        if [ -n "$$NGROK_URL" ]; then
          exec /entrypoint.sh http --url="$$NGROK_URL" "$$TARGET"
        else
          exec /entrypoint.sh http "$$TARGET"
        fi
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4040"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 4040

networks:
  tipi_main_network:
    external: true
