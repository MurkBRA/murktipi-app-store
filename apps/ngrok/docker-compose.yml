x-runtipi:
  schema_version: 2

services:
  ngrok:
    image: ngrok/ngrok:3.39.13-alpine
    container_name: "${CONTAINER_NAME:-ngrok}"
    restart: unless-stopped
    command: http --url=${NGROK_URL} ${NGROK_TARGET:-80}
    ports:
      - "${APP_PORT}:4040"
    environment:
      - TZ=${TZ}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4040"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 4040

networks:
  tipi_main_network:
    external: true
