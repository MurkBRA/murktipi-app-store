x-runtipi:
  schema_version: 2

services:
  ngrok:
    image: ghcr.io/murkbra/ngrok:3.39.13
    container_name: "${CONTAINER_NAME:-ngrok}"
    restart: unless-stopped
    ports:
      - "${APP_PORT}:4040"
    environment:
      - TZ=${TZ}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_URL=${NGROK_URL}
      - ENABLE_NGINX_FILTER=${ENABLE_NGINX_FILTER:-true}
      - NGROK_TARGET
      - NGINX_CONF_BASE64
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4040"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tipi_main_network
    x-runtipi:
      is_main: true
      internal_port: 4040

networks:
  tipi_main_network:
    external: true
